# Fly.io config. Change `app` to a unique name before `fly launch` / `fly deploy`.
app = "ms-break-assistant"
primary_region = "iad"

[build]

[env]
  DATA_DIR = "/data"
  MARKET_TIMEZONE = "America/New_York"

# Persistent disk for the SQLite database (create with: fly volumes create data --size 1)
[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine running so TradingView webhooks are answered instantly.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
